name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  code_quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Unit and CLI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The tests requiring a device are marked as ignored and run in the `smoke-test` job.
      - run: cargo test

  smoke-test:
    name: Oniro Emulator Test
    runs-on: ubuntu-latest
    env:
      OHOS_TARGET: x86_64-unknown-linux-ohos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-ohos
      - name: Setup OpenHarmony SDK
        id: setup_sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: 6.1
      - name: Add OHOS toolchains to PATH
        run: |
          echo "$(dirname "${OHOS_SDK_NATIVE}")/toolchains" >> "$GITHUB_PATH"
        env:
          OHOS_SDK_NATIVE: ${{ steps.setup_sdk.outputs.ohos_sdk_native }}
      - name: Start Oniro emulator
        uses: openharmony-rs/emulator-action@v0.1
      - name: Run OHOS smoke test
        run: cargo test --test smoke_test -- --ignored
        env:
          OHOS_TEST_RUNNER_INTEGRATION_TARGET: ${{ env.OHOS_TARGET }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_OHOS_LINKER: ${{ steps.setup_sdk.outputs.ohos_sdk_native }}/llvm/bin/x86_64-unknown-linux-ohos-clang
      - name: Upload OHOS smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohos-smoke-artifacts
          path: /tmp/oniro-emulator.log
